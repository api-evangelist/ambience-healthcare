apis:
- name: Ambience Integration API
  description: 'Partner-facing integration APIs for EHRs, telehealth platforms and
    healthcare applications, covering medical encounter transcription, clinical note
    generation, integrated CDI with ICD-10 suggestions, EHR patient context enrichment
    and authenticated access control. Documentation and credentials are granted on
    request via emr-integration@ambiencehealthcare.com; no public API reference, base
    URL or self-service signup is published, so no baseURL is recorded here.'
  humanURL: https://docs.ambiencehealthcare.com/
  x-access: request-only
  tags:
  - Clinical Documentation
  - Transcription
  - Medical Coding
  - Electronic Health Records
  properties:
  - type: Documentation
    url: https://docs.ambiencehealthcare.com/
  - type: Contact
    url: mailto:emr-integration@ambiencehealthcare.com
- name: Ambience Identity (OAuth 2.0 / OpenID Connect)
  description: 'The OpenID Connect provider fronting the Ambience application and API
    platform. Publishes an RFC 8414 / OIDC Discovery document anonymously at /.well-known/openid-configuration,
    advertising authorization, token, device-code, userinfo, JWKS, dynamic client registration
    and revocation endpoints, PKCE (S256), DPoP (ES256), private_key_jwt client authentication
    and the client_credentials, authorization_code, refresh_token, device_code, token-exchange
    and jwt-bearer grants.'
  humanURL: https://auth.ambiencehealthcare.com/.well-known/openid-configuration
  baseURL: https://auth.ambiencehealthcare.com
