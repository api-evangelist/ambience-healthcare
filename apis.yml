aid: ambience-healthcare
name: Ambience Healthcare
description: 'Ambience Healthcare is a San Francisco based ambient clinical AI company
  whose platform listens to the patient encounter and produces documentation, coding
  and revenue-cycle output for health systems. Its products include AutoScribe (ambient
  AI medical scribe tuned to 100+ specialties and subspecialties), AutoCDI, AutoAVS,
  AutoRefer, AutoPrep, a Chart Awareness layer and a nursing suite. Ambience runs inside
  the EHR rather than beside it: it is distributed through the Epic Toolbox (Hyperspace
  and Haiku) using SMART on FHIR, through the athenahealth Marketplace, and into Oracle
  Cerner Millennium over FHIR and REST APIs, reading patient context from the chart
  and writing structured notes, codes and summaries back. The company also publishes
  a partner-facing Integration API programme at docs.ambiencehealthcare.com for EHRs,
  telehealth platforms and healthcare applications covering encounter transcription,
  note generation, CDI with ICD-10 suggestion and chart context enrichment, with access
  granted on request rather than through public self-service signup.'
